# PixelCount Studio Supabase project config (Edge Functions + local tooling)

[api]
enabled = true

[db]
major_version = 15

[functions.validate-referral-code]
verify_jwt = false

[functions.apply-referral]
verify_jwt = true

[functions.payment-webhook]
# Provider server-to-server callbacks do not send a Supabase JWT.
# Authentication must be implemented via provider signature verification.
verify_jwt = false
